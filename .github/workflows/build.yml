name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B build/native-cmake -A x64
      - name: Build
        run: cmake --build build/native-cmake --config Release --parallel
      - name: Test
        run: ctest --test-dir build/native-cmake -C Release --output-on-failure
      - name: Also build with build.cmd
        shell: cmd
        run: native\build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: efml-native
          path: |
            build/native-cmake/stage/Release/runtime/*.dll
            build/native-cmake/stage/Release/runtime/*.exe
            build/native-cmake/stage/Release/sdk/*.dll
          if-no-files-found: error

  manager:
    needs: native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/download-artifact@v4
        with:
          name: efml-native
          path: build/native
      - name: Publish manager
        shell: pwsh
        run: |
          dotnet publish manager/EFML.Manager/EFML.Manager.csproj -c Release -r win-x64 --self-contained true `
            -p:Platform=x64 -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false `
            -p:PublishDir="$PWD\build\stage\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage runtime and SDK
        shell: pwsh
        run: |
          $stage = "build\stage"
          New-Item -ItemType Directory -Force "$stage\runtime", "$stage\sdk\include", "$stage\sdk\examples" | Out-Null
          Copy-Item build\native\runtime\* "$stage\runtime\"
          Copy-Item -Recurse native\include\* "$stage\sdk\include\"
          Copy-Item -Recurse sdk\examples\echo "$stage\sdk\examples\echo"
          New-Item -ItemType Directory -Force "$stage\sdk\examples\echo\native\windows-x64" | Out-Null
          Copy-Item build\native\sdk\example.echo.dll "$stage\sdk\examples\echo\native\windows-x64\"
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md $stage
          if (Test-Path docs) { Copy-Item -Recurse docs "$stage\docs" }
          foreach ($f in @('EFML.exe', 'runtime\EFML.Host.dll', 'runtime\EFML.Injector.exe', 'runtime\xinput1_4.dll', 'runtime\efml.exe')) {
            if (-not (Test-Path "$stage\$f")) { throw "missing $f" }
          }
          Get-ChildItem -Recurse $stage | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
      - name: Echo example package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\stage\sdk\examples\echo\* -DestinationPath dist\EFML-Echo-example.zip -Force
      - name: Portable zip
        shell: pwsh
        run: |
          $version = ([xml](Get-Content manager/EFML.Manager/EFML.Manager.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "EFML_VERSION=$version" >> $env:GITHUB_ENV
          Compress-Archive -Path build\stage\* -DestinationPath "dist\EFML-$version-portable.zip" -Force
      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc.Source "/DStageDir=$PWD\build\stage" "/DOutputDir=$PWD\dist" "/DAppVersion=$env:EFML_VERSION" installer\EFML.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: efml-release
          path: dist/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          if (Test-Path $notes) {
            gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist -File).FullName --title "EFML $env:EFML_VERSION" --notes-file $notes
          } else {
            gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist -File).FullName --title "EFML $env:EFML_VERSION" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
